# ─────────────────────────────────────────────────────────────
# VextJS 文档站 — 保留源码仓库 Pages，并新增组织根站点
#
# 触发条件：
#   - main 的 push-triggered CI 成功后，部署该次 CI 的精确 SHA
#   - 在 main 手动触发（workflow_dispatch）
#
# 流水线结构：
#   1. build  — 在 website/ 目录安装依赖并执行 rspress build
#   2. deploy-pages — 保留源码仓库的 /vextjs/ Pages 发布
#   3. deploy-organization — 新增独立组织根站点 https://vextjs.github.io/
#
# 首次配置：目标仓库初始化 main，Pages 选择 main / (root)，
#           添加可写 Deploy Key，并在源码仓库保存 VEXT_DOCS_DEPLOY_KEY。
#
# @see website/package.json §scripts
# @see https://rspress.dev/guide/start/deploy
# ─────────────────────────────────────────────────────────────

name: Deploy Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

# 源码与产物读取使用 GITHUB_TOKEN；目标仓库写入使用专用 SSH Deploy Key。
permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# ── Jobs ─────────────────────────────────────────────────────

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. 构建文档站
  # ────────────────────────────────────────────────────────────
  build:
    name: Build Docs (${{ matrix.site }})
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    permissions:
      contents: read
      pages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: project
            base: /vextjs/
            url: https://devcodex-labs.github.io/vextjs
          - site: organization
            base: /
            url: https://vextjs.github.io
    env:
      VEXT_DOCS_BASE: ${{ matrix.base }}
      VEXT_DOCS_SITE_URL: ${{ matrix.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 获取完整提交历史，rspress lastUpdated 功能需要
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Verify deployment commit
        shell: bash
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [[ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]]; then
            echo "Expected CI SHA: $DEPLOY_SHA"
            echo "Checked out SHA: $ACTUAL_SHA"
            exit 1
          fi
          echo "Building deployment SHA: $ACTUAL_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Setup source repository Pages
        if: matrix.site == 'project'
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Install package dependencies and build CLI for docs verification
        run: npm ci && npm run build

      - name: Audit website production dependencies
        working-directory: website
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: website
        run: npm run build:publish -- --rollout=final
        env:
          NODE_ENV: production

      - name: Prepare Pages files
        shell: bash
        run: |
          cat > website/dist/robots.txt <<EOF
          User-agent: *
          Allow: /

          Sitemap: ${VEXT_DOCS_SITE_URL}/sitemap.xml
          EOF
          touch website/dist/.nojekyll

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist-${{ matrix.site }}
          path: website/dist
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload source repository Pages artifact
        if: matrix.site == 'project'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  # 在进入发布并发组前跳过旧 CI 的迟到构建。
  prepare-deployment:
    name: Check deployment prerequisites
    runs-on: ubuntu-latest
    needs: build
    outputs:
      current: ${{ steps.current.outputs.publish }}
      organization_ready: ${{ steps.organization.outputs.ready }}
    steps:
      - name: Check current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$CURRENT_SHA" == "$DEPLOY_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded build: $DEPLOY_SHA (main is $CURRENT_SHA)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check organization deployment setup
        id: organization
        if: steps.current.outputs.publish == 'true'
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.VEXT_DOCS_DEPLOY_KEY }}
        shell: bash
        run: |
          if [[ -n "$DOCS_DEPLOY_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping organization Pages publication until VEXT_DOCS_DEPLOY_KEY is configured."
          fi

  # 原源码仓库 Pages 保留官方 Actions 发布流程，与组织站点并行。
  deploy-pages:
    name: Publish source repository Pages
    runs-on: ubuntu-latest
    needs: prepare-deployment
    if: needs.prepare-deployment.outputs.current == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: vextjs-docs-project
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$CURRENT_SHA" == "$DEPLOY_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded build: $DEPLOY_SHA (main is $CURRENT_SHA)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy source repository Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  # ────────────────────────────────────────────────────────────
  # 新增组织根站点；其密钥或推送失败不阻止原站点的独立发布任务。
  # ────────────────────────────────────────────────────────────
  deploy-organization:
    name: Publish to vextjs.github.io
    runs-on: ubuntu-latest
    needs: prepare-deployment
    if: >-
      needs.prepare-deployment.outputs.current == 'true' &&
      needs.prepare-deployment.outputs.organization_ready == 'true'

    # 只串行化已通过构建且仍对应 main 的发布，不中断正在进行的 Git 推送。
    concurrency:
      group: vextjs-docs-organization
      cancel-in-progress: false

    environment:
      name: organization-docs
      url: https://vextjs.github.io/

    env:
      DOCS_PUBLISH_REPOSITORY: vextjs/vextjs.github.io
      VEXT_DOCS_SITE_URL: https://vextjs.github.io

    steps:
      - name: Check current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$CURRENT_SHA" != "$DEPLOY_SHA" ]]; then
            echo "Skipping superseded build: $DEPLOY_SHA (main is $CURRENT_SHA)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify deployment key
        if: steps.current.outputs.publish == 'true'
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.VEXT_DOCS_DEPLOY_KEY }}
        shell: bash
        run: |
          if [[ -z "$DOCS_DEPLOY_KEY" ]]; then
            echo "::error::Set VEXT_DOCS_DEPLOY_KEY to the writable Deploy Key for ${DOCS_PUBLISH_REPOSITORY}."
            exit 1
          fi

      - name: Checkout Pages repository
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DOCS_PUBLISH_REPOSITORY }}
          ref: main
          path: site
          ssh-key: ${{ secrets.VEXT_DOCS_DEPLOY_KEY }}

      - name: Download verified docs
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: docs-dist-organization
          path: docs-dist

      - name: Publish verified docs
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          test -f docs-dist/index.html
          test -f docs-dist/zh/index.html
          test -f docs-dist/docs-manifest.json
          test -f docs-dist/sitemap.xml
          git -C site rm -r --ignore-unmatch -- .
          cp -a docs-dist/. site/
          touch site/.nojekyll
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo "Documentation is already current."
          else
            git commit -m "docs: publish ${DEPLOY_SHA}"
            git push origin HEAD:main
          fi
          echo "Published to ${DOCS_PUBLISH_REPOSITORY}; Pages will update ${VEXT_DOCS_SITE_URL}/"
