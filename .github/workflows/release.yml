# ─────────────────────────────────────────────────────────────
# vextjs Release — Manual Qualification / Tag Publication
#
# 手动运行：仅 main 分支，完成候选与四格证据验收，不发布。
# 正式发布：推送 v* 格式的 tag（如 v2.0.0, v2.1.0-rc.1）。
# stable 版本发布到 npm latest；prerelease 版本发布到 npm next。
#
# 流水线结构：
#   1. 入口与版本一致性检查
#   2. CI 验证（typecheck + build + 全量测试）
#   3. 文档站构建验证（rspress build — 构建失败则阻断发版）
#   4. 冻结唯一候选，固定外部消费者提交
#   5. Windows/Linux × Node 20/22 消费同一候选
#   6. 汇总并验证外部证据（手动运行到此结束，不代表通过发布审查）
#   7. 仅 tag push：final preflight → npm publish → GitHub Release
#
# 前置条件：
#   - npm token 配置为 GitHub Secret: NPM_TOKEN
#   - 私有外部消费者读取 token 配置为 GitHub Secret: VEXTJS_TEST_TOKEN
#     （迁移期间兼容既有 VEXTJS_GH_PAGES_TOKEN）
#   - package.json 版本号已更新（与 tag 一致）
#
# 用法：
#   git tag v1.0.0
#   git push origin v1.0.0
#
# @see IMPLEMENTATION-PLAN.md 任务 4.7（正式发布）
# ─────────────────────────────────────────────────────────────

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 同一事件与 ref 串行运行；手动验收与 tag 发布互不替代
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_ENV: test

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. CI 验证（完整测试套件）
  # ────────────────────────────────────────────────────────────
  ci:
    name: CI Verification
    needs: version-check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run test/unit --reporter=verbose

      - name: Integration tests
        run: npx vitest run test/integration --reporter=verbose

      - name: E2E tests (Node 22 only)
        if: matrix.node-version == 22
        run: npx vitest run test/e2e --reporter=verbose
        timeout-minutes: 10

  # ────────────────────────────────────────────────────────────
  # 2. 版本一致性检查
  # ────────────────────────────────────────────────────────────
  version-check:
    name: Version Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify workflow entry and exact release tag
        run: node scripts/release-entry.mjs

      - name: Verify development docs version sync (qualification only)
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/check-version-sync.sh

      - name: Verify release docs version sync (tag publication only)
        if: github.event_name == 'push'
        run: bash scripts/check-version-sync.sh --release

  # ────────────────────────────────────────────────────────────
  # 3. 文档站构建验证
  # ────────────────────────────────────────────────────────────
  docs-build:
    name: Build Docs (Gate)
    needs: version-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Audit website production dependencies
        working-directory: website
        run: npm audit --omit=dev --audit-level=high

      - name: Build docs (rspress build)
        working-directory: website
        run: npm run build
        env:
          NODE_ENV: production

  # ────────────────────────────────────────────────────────────
  # 4. 冻结唯一候选并固定外部消费者提交
  # ────────────────────────────────────────────────────────────
  freeze-candidate:
    name: Freeze immutable release candidate
    runs-on: ubuntu-latest
    needs: [ci, version-check, docs-build]

    outputs:
      consumer-commit: ${{ steps.consumer-checkout.outputs.commit }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Freeze candidate tarball and semantic receipt
        run: |
          npm run freeze:release-candidate -- \
            --output-dir "${RUNNER_TEMP}/vextjs-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --task-id "release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Verify external consumer credential
        shell: bash
        env:
          VEXTJS_TEST_TOKEN: ${{ secrets.VEXTJS_TEST_TOKEN || secrets.VEXTJS_GH_PAGES_TOKEN }}
        run: |
          test -n "${VEXTJS_TEST_TOKEN:-}" || {
            echo "VEXTJS_TEST_TOKEN is required to read the private vextjs-test repository" >&2
            exit 1
          }

      - name: Checkout external consumer main for commit resolution
        id: consumer-checkout
        uses: actions/checkout@v7
        with:
          repository: devcodex-labs/vextjs-test
          ref: main
          path: external-consumer-ref
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.VEXTJS_TEST_TOKEN || secrets.VEXTJS_GH_PAGES_TOKEN }}

      - name: Verify one resolved external consumer commit
        shell: bash
        run: |
          CONSUMER_COMMIT='${{ steps.consumer-checkout.outputs.commit }}'
          if [[ ! "${CONSUMER_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve the vextjs-test main commit" >&2
            exit 1
          fi

      - name: Upload immutable candidate
        uses: actions/upload-artifact@v7
        with:
          name: vextjs-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vextjs-candidate-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────
  # 5. 同一候选的 Windows/Linux × Node 20/22 外部消费矩阵
  # ────────────────────────────────────────────────────────────
  external-consumer:
    name: External consumer / ${{ matrix.os }} / Node ${{ matrix.node-version }}
    needs: freeze-candidate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          path: vext-source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout fixed external consumer commit
        uses: actions/checkout@v7
        with:
          repository: devcodex-labs/vextjs-test
          ref: ${{ needs.freeze-candidate.outputs.consumer-commit }}
          path: external-consumer
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.VEXTJS_TEST_TOKEN || secrets.VEXTJS_GH_PAGES_TOKEN }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download immutable candidate
        uses: actions/download-artifact@v8
        with:
          name: vextjs-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vextjs-candidate

      - name: Run exact packed external consumer cell
        shell: pwsh
        working-directory: vext-source
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $artifact = Join-Path '${{ runner.temp }}/vextjs-candidate' "vextjs-$version.tgz"
          $receipt = Join-Path '${{ runner.temp }}/vextjs-candidate' 'candidate-receipt.json'
          $platform = if ('${{ runner.os }}' -eq 'Windows') { 'win32' } else { 'linux' }
          $cell = "${platform}-node${{ matrix.node-version }}"
          $output = Join-Path '${{ runner.temp }}/external-evidence' $cell
          node scripts/validation/run-external-consumer-cell.mjs `
            --artifact $artifact `
            --candidate-receipt $receipt `
            --consumer-root '${{ github.workspace }}/external-consumer' `
            --consumer-repo 'https://github.com/devcodex-labs/vextjs-test.git' `
            --output-dir $output `
            --material-prefix "cells/$cell" `
            --platform $platform `
            --node-major '${{ matrix.node-version }}' `
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}-$cell" `
            --task-id 'release-${{ github.run_id }}-${{ github.run_attempt }}' `
            --test-cell $cell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload immutable cell materials
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vextjs-external-cell-${{ matrix.os }}-node${{ matrix.node-version }}
          path: ${{ runner.temp }}/external-evidence/
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────
  # 6. 汇总并验证四格证据，形成唯一 qualified release artifact
  # ────────────────────────────────────────────────────────────
  aggregate-evidence:
    name: Aggregate and verify external evidence
    if: always() && needs.freeze-candidate.result == 'success'
    needs: [freeze-candidate, external-consumer]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          path: vext-source
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download immutable candidate
        uses: actions/download-artifact@v8
        with:
          name: vextjs-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-release/candidate

      - name: Download all external consumer cell materials
        uses: actions/download-artifact@v8
        with:
          pattern: vextjs-external-cell-*
          path: ${{ runner.temp }}/qualified-release/cells
          merge-multiple: true

      - name: Assemble and verify versioned external evidence
        working-directory: vext-source
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/validation/assemble-external-evidence.mjs \
            --records-dir "${RUNNER_TEMP}/qualified-release/cells" \
            --output "${RUNNER_TEMP}/qualified-release/external-evidence.json" \
            --artifact "${RUNNER_TEMP}/qualified-release/candidate/vextjs-${VERSION}.tgz" \
            --candidate-receipt "${RUNNER_TEMP}/qualified-release/candidate/candidate-receipt.json"

      - name: Upload qualified release artifact
        uses: actions/upload-artifact@v7
        with:
          name: vextjs-qualified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-release/
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────
  # 7. npm Publish
  # ────────────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: aggregate-evidence

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Download qualified release artifact
        uses: actions/download-artifact@v8
        with:
          name: vextjs-qualified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-release

      - name: Install dependencies
        run: npm ci

      - name: Bind final preflight to qualified materials
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CANDIDATE="${RUNNER_TEMP}/qualified-release/candidate/vextjs-${VERSION}.tgz"
          RECEIPT="${RUNNER_TEMP}/qualified-release/candidate/candidate-receipt.json"
          EVIDENCE="${RUNNER_TEMP}/qualified-release/external-evidence.json"
          test -f "${CANDIDATE}"
          test -f "${RECEIPT}"
          test -f "${EVIDENCE}"
          echo "VEXT_PREFLIGHT_VEXT_TARBALL=${CANDIDATE}" >> "${GITHUB_ENV}"
          echo "VEXT_PREFLIGHT_CANDIDATE_RECEIPT=${RECEIPT}" >> "${GITHUB_ENV}"
          echo "VEXT_EXTERNAL_EVIDENCE_FILE=${EVIDENCE}" >> "${GITHUB_ENV}"

      - name: Resolve release channel
        id: release-channel
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          node scripts/release-channel.mjs --version "${VERSION}" --github-output "${GITHUB_OUTPUT}"

      - name: Fetch protected main reference
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify tag commit is contained in origin/main
        run: npm run verify:release-ancestry

      - name: Run final non-publishing preflight
        run: npm run release:preflight:final
        env:
          VEXT_RELEASE_CHANNEL: ${{ steps.release-channel.outputs.release_channel }}
          VEXT_NPM_DIST_TAG: ${{ steps.release-channel.outputs.npm_dist_tag }}
          VEXT_GITHUB_PRERELEASE: ${{ steps.release-channel.outputs.github_prerelease }}

      - name: Publish to npm
        run: |
          test -n "${VEXT_PREFLIGHT_VEXT_TARBALL:-}" && test -f "${VEXT_PREFLIGHT_VEXT_TARBALL}"
          npm publish "${VEXT_PREFLIGHT_VEXT_TARBALL}" --ignore-scripts --provenance --access public --tag "${{ steps.release-channel.outputs.npm_dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.release-channel.outputs.version }}
          prerelease: ${{ steps.release-channel.outputs.github_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## 📦 vextjs v${{ steps.release-channel.outputs.version }}

            ```bash
            npm install vextjs@${{ steps.release-channel.outputs.version }}
            ```

            See the full changelog below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
